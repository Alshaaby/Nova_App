<style>
:root{--bg:#F1F2EC;--card:#FCFDFB;--line:#E4E7DD;--line2:#CFD5C6;--ink:#181C24;--mut:#7D8482;--pri:#101820;--teal:#0E8F86;--teal-d:#0B6E67;--acc:#B85C38;--acc-d:#94472A;--ok:#22795A;--bad:#B23A48;--soft:#F3F5EE;--rad:12px}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Noto Kufi Arabic',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14.5px;color:var(--ink);background:#fff;border:1.5px solid var(--line2);border-radius:9px;padding:9px 11px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
.num{font-family:'IBM Plex Mono','Courier New',monospace;direction:ltr;unicode-bidi:isolate;font-weight:600;letter-spacing:-.2px}
.hidden{display:none!important}i.ph,i.ph-duotone,i.ph-fill{vertical-align:-3px}a{color:var(--teal-d);text-decoration:none}
/* بديل الأيقونات عند غياب خط Phosphor (أوفلاين) */
body.noicons i[class^="ph"]{display:none!important}
body.noicons .btn.ico::after{content:attr(data-lb);font-weight:700;font-size:12px}
.btn{border:1.5px solid transparent;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;background:#E7EAE0;color:var(--ink);display:inline-flex;align-items:center;gap:7px;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pri);color:#F2F4EE}.btn.teal{background:var(--teal);color:#fff}.btn.acc{background:var(--acc);color:#FBF2EC}
.btn.gh{background:transparent;border-color:var(--line2)}.btn.dng{background:transparent;border-color:#DBA9A2;color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}.btn.ico{padding:6px 9px;background:transparent;border-color:var(--line2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
#lock{position:fixed;inset:0;background:#101820;color:#E9EDE4;display:flex;align-items:center;justify-content:center;padding:22px;overflow:auto;z-index:50;background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(14,143,134,.06) 27px 28px)}
.lcard{position:relative;z-index:2;width:100%;max-width:420px;background:var(--card);color:var(--ink);border-radius:18px;padding:30px 26px 22px;box-shadow:0 30px 70px rgba(0,0,0,.55);border:1px solid #26313B}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:16px}
.logo h1{font-size:29px;font-weight:700}.logo h1 span{color:var(--teal)}.logo p{font-size:12.5px;color:var(--mut);text-align:center}
.lcard label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:13px 0 5px}
.lcard .btn{width:100%;justify-content:center;margin-top:10px}
.lsec{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2);font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:7px;justify-content:center;flex-wrap:wrap;text-align:center}
.demo-hint{margin-top:13px;background:var(--soft);border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--mut)}
.demo-hint b{color:var(--ink)}
.err{background:#F9E9EA;color:var(--bad);border-radius:9px;padding:8px 12px;font-size:13px;margin-top:12px;text-align:center}
.licok{margin-top:12px;border:1.5px solid var(--teal);border-radius:12px;padding:10px 12px;background:#EFF7F5}

.setup2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}

#app{min-height:100dvh;display:flex;flex-direction:column}#side{display:none}
main{flex:1;display:flex;flex-direction:column;min-width:0}

.badge.g{color:var(--teal-d);border-color:#B5D8D2;background:#EBF5F3}.badge.o{color:var(--acc-d);border-color:#E0C0AC;background:#F8EEE7}

.ditem{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;padding:11px 10px;border-radius:10px;font-size:14.5px;font-weight:700;text-align:right}
.ditem i{font-size:20px;color:var(--teal)}
@media(min-width:960px){#app{flex-direction:row}#bnav,#drawer{display:none!important}
 #side{display:flex;flex-direction:column;width:244px;flex-shrink:0;background:#101820;color:#C9D2CC;padding:20px 12px;position:sticky;top:0;height:100dvh}
 #side .sbrand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
 #side .sbrand b{font-size:19px}#side .sbrand span{color:var(--teal)}
 #side .sbrand small{display:block;font-size:10.5px;color:#7D8B85;font-weight:400}
 #side nav{flex:1;overflow:auto}
 .sitem{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:#9AAEA6;padding:9.5px 10px;border-radius:9px;font-size:13.5px;font-weight:700;text-align:right;margin-bottom:2px;border-inline-start:3px solid transparent}
 .sitem i{font-size:18px}.sitem:hover{background:rgba(255,255,255,.06);color:#fff}
 .sitem.on{background:#F1F2EC;color:var(--pri);border-inline-start-color:var(--teal)}
 #side .sfoot{border-top:1px solid rgba(255,255,255,.1);padding-top:12px;margin-top:10px;font-size:12px;color:#9AAEA6}
 #side .sfoot .btn{width:100%;justify-content:center;margin-top:8px;background:rgba(255,255,255,.08);color:#E9EDE4}
 #view{padding:24px 26px}#top{padding:12px 26px}}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.vhead h2{font-size:21px;font-weight:700}.vhead p{font-size:12.5px;color:var(--mut)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}.card h3 i{color:var(--teal)}
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tbar input,.tbar select{width:auto;min-width:150px}
.tscroll{overflow:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
th{font-size:11.5px;color:var(--mut);font-weight:700;text-align:right;padding:7px 9px;border-bottom:1.5px solid var(--line2);white-space:nowrap}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#F7F9F2}
.numcell{font-family:'IBM Plex Mono','Courier New',monospace;direction:ltr;text-align:left;white-space:nowrap;font-weight:600}
.tot td{border-top:2px solid var(--line2);border-bottom:none;font-weight:700;background:var(--soft)}
.empty{padding:26px;text-align:center;color:var(--mut);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:5px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px}
.kpi .kt{font-size:12px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .kt i{color:var(--teal);font-size:16px}.kpi .kv{font-size:21px;font-weight:700;margin-top:3px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars .b .fill{width:100%;max-width:34px;background:var(--teal);border-radius:5px 5px 2px 2px;min-height:3px}
.bars .b.today .fill{background:var(--pri)}.bars .b .lb{font-size:10px;color:var(--mut)}
.trow{display:flex;align-items:center;gap:6px;padding:6.5px 8px;border-bottom:1px solid var(--line);border-radius:7px;font-size:13.5px}
.trow:hover{background:#F7F9F2}
.trow .tw{width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--mut);font-size:14px}
.trow .tcode{font-family:'IBM Plex Mono',monospace;direction:ltr;font-size:12px;color:var(--teal-d);font-weight:600;min-width:56px}
.trow .tname{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tval{font-family:'IBM Plex Mono',monospace;direction:ltr;font-size:12px;white-space:nowrap;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.trow .tacts{display:flex;gap:2px;opacity:.35}.trow:hover .tacts{opacity:1}
.trow.grp .tname{font-weight:700}.trow.off{opacity:.5}
.balbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:#E7EAE0;margin:10px 0 4px}
.balbar div{height:100%}.balbar .d{background:var(--pri)}.balbar .c{background:var(--teal)}
.balbar.ok .d,.balbar.ok .c{background:var(--ok)}
.jfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:13px}
.mwrap{position:fixed;inset:0;z-index:60;background:rgba(10,16,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px 14px;overflow:auto}
.mcard{background:var(--card);border-radius:16px;width:100%;max-width:640px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(14px);opacity:0}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
.mhead b{font-size:16px}.mhead button{background:none;border:none;font-size:20px;color:var(--mut)}
.mbody{padding:18px}
.mrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
#toasts{position:fixed;top:14px;left:14px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(90vw,340px)}
.toast{background:#141B22;color:#EDEFDF;border-radius:11px;padding:11px 15px;font-size:13.5px;font-weight:500;border-inline-start:4px solid var(--teal);box-shadow:0 10px 30px rgba(0,0,0,.3);animation:tin .22s ease}
.toast.bad{border-color:#E07B72}.toast.info{border-color:#D8A06A}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:transparent;border:1.5px solid var(--line2);border-radius:99px;padding:6.5px 15px;font-size:13px;font-weight:700;color:var(--mut)}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#F1F2EC}
.mini{font-size:12px;color:var(--mut)}.big{font-size:24px;font-weight:700}
hr.sep{border:none;border-top:1px dashed var(--line2);margin:14px 0}
.ledgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.posWrap{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
@media(max-width:880px){.posWrap{grid-template-columns:1fr}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:right}
.pcard:hover{border-color:var(--teal)}.pcard.o{opacity:.45;cursor:not-allowed}
.pcard b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pp{font-size:13px;color:var(--teal-d)}.pcard .pq{font-size:11px;color:var(--mut);display:block}
.posCart{position:sticky;top:70px}
.cartRow{display:flex;align-items:center;gap:6px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.cartRow .cn{flex:1;min-width:90px}
.qbtn{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line2);background:#fff;font-weight:700;flex-shrink:0}
.rrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:14px;gap:8px}
.rcpt{width:302px;max-width:100%;margin:0 auto;background:#fff;color:#000;padding:14px 12px;font-family:'IBM Plex Mono','Courier New',monospace;font-size:12px;line-height:1.55;border:1px dashed var(--line2)}
.rcpt hr{border:none;border-top:1px dashed #999;margin:6px 0}
.rcpt .c{text-align:center}.rcpt .r{display:flex;justify-content:space-between;gap:8px}.rcpt .tt{font-size:15px;font-weight:700}
.rcpt img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto 4px}

#printHost .tt{font-weight:700}#printHost .center{text-align:center}

.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>

<body>
<div id="lock"></div>
<div id="app" class="hidden">
  <aside id="side"></aside>
  <main>
    <header id="top">
      <span class="tbrand"><svg width="20" height="20" viewBox="0 0 48 48" fill="none"><path d="M24 4 41 14v20L24 44 7 34V14Z" stroke="var(--teal)" stroke-width="3" fill="none"/><path d="M26.5 12 17 26.5h6.2L21 36l9.5-14.5h-6.2z" fill="var(--teal)"/></svg> NOVA<span>TECH</span></span>
      <span class="tco" id="topCo"></span><span id="licB"></span><span class="grow"></span>
      <span class="uchip" id="uchip"></span>
      <button class="btn ico" data-lb="قفل" onclick="lockNow()" title="قفل الجلسة"><i class="ph ph-lock-key"></i></button>
    </header>
    <div id="view"></div>
  </main>
  <nav id="bnav"></nav>
  <div id="drawer"><div class="dv" onclick="closeDrawer()"></div><div class="dp" id="drawerP"></div></div>
</div>

<div id="toasts"></div>
<div id="mwrap" class="mwrap hidden"><div class="mcard"><div class="mhead"><b id="mtitle"></b><button onclick="mClose()"><i class="ph ph-x"></i></button></div><div class="mbody" id="mbody"></div></div></div>
<input type="file" id="fileIn" accept=".json" class="hidden" onchange="restoreFile(this)">
<input type="file" id="xlsIn" accept=".xlsx,.csv,.xls" class="hidden" onchange="importPick(this)">
<input type="file" id="logoIn" accept="image/*" class="hidden" onchange="logoPick(this)">

<script>
'use strict';
/* ================= أدوات عامة ================= */
const $=s=>document.querySelector(s);
const gv=id=>{const e=document.getElementById(id);return e?e.value:null;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2=n=>Math.round((+n||0)*100)/100;
const r3=n=>Math.round((+n||0)*1000)/1000;
const r4=n=>Math.round((+n||0)*10000)/10000;
const r6=n=>Math.round((+n||0)*1e6)/1e6;
const fmt=n=>(round2(n)).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtq=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:3});
const today=()=>new Date().toISOString().slice(0,10);
const dAr=d=>new Date(d+'T00:00:00').toLocaleDateString('ar',{weekday:'short',day:'numeric',month:'short'});
const nowStr=()=>new Date().toLocaleString('ar',{dateStyle:'short',timeStyle:'short'});
function toast(msg,type='ok'){const t=document.createElement('div');t.className='toast '+(type==='ok'?'':type);t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320)},3400);}
let _cb=null;
function mDialog(title,html){$('#mtitle').textContent=title;$('#mbody').innerHTML=html;$('#mwrap').classList.remove('hidden');}
function mClose(){$('#mwrap').classList.add('hidden');$('#mbody').innerHTML='';}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c;}return t;})();
function crc32(u8){let c=~0;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (~c)>>>0;}
const encT=new TextEncoder();
function zipCreate(files){
 const d=new Date();
 const dosTime=((d.getHours()<<11)|(d.getMinutes()<<5)|(Math.floor(d.getSeconds()/2)))&0xFFFF;
 const dosDate=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
 const parts=[];const central=[];let offset=0;
 for(const f of files){
  const nameB=encT.encode(f.name),data=f.data,crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
  h.setUint16(10,dosTime,true);h.setUint16(12,dosDate,true);
  h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);
  h.setUint16(26,nameB.length,true);h.setUint16(28,0,true);
  parts.push(new Uint8Array(h.buffer),nameB,data);
  central.push({nameB,crc,size:data.length,off:offset});
  offset+=30+nameB.length+data.length;}
 const cdStart=offset;let cdSize=0;
 for(const c of central){
  const h=new DataView(new ArrayBuffer(46));
  h.setUint32(0,0x02014b50,true);h.setUint16(4,20,true);h.setUint16(6,20,true);h.setUint16(8,0x0800,true);h.setUint16(10,0,true);
  h.setUint16(12,dosTime,true);h.setUint16(14,dosDate,true);
  h.setUint32(16,c.crc,true);h.setUint32(20,c.size,true);h.setUint32(24,c.size,true);
  h.setUint16(28,c.nameB.length,true);h.setUint16(30,0,true);h.setUint16(32,0,true);
  h.setUint16(34,0,true);h.setUint16(36,0,true);h.setUint32(38,0,true);h.setUint32(42,c.off,true);
  parts.push(new Uint8Array(h.buffer),c.nameB);
  cdSize+=46+c.nameB.length;}
 const e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(4,0,true);e.setUint16(6,0,true);
 e.setUint16(8,central.length,true);e.setUint16(10,central.length,true);
 e.setUint32(12,cdSize,true);e.setUint32(16,cdStart,true);e.setUint16(20,0,true);
 parts.push(new Uint8Array(e.buffer));
 return new Blob(parts,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});}
const xesc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function colRef(i){let s='';i++;while(i>0){s=String.fromCharCode(65+(i-1)%26)+s;i=Math.floor((i-1)/26);}return s;}
function sheetXml(aoa){
 let xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
 aoa.forEach((row,ri)=>{
  xml+=`<row r="${ri+1}">`;
  row.forEach((v,ci)=>{
   if(v===''||v==null)return;
   const ref=colRef(ci)+(ri+1);
   if(typeof v==='number'&&isFinite(v))xml+=`<c r="${ref}"><v>${v}</v></c>`;
   else xml+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;});
  xml+='</row>';});
 return xml+'</sheetData></worksheet>';}
function naXlsx(sheets){ /* sheets: [{name, aoa}] */
 const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>';

 const wbr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+'</Relationships>';
 const files=[
  {name:'[Content_Types].xml',data:encT.encode(ct)},
  {name:'_rels/.rels',data:encT.encode(rels)},
  {name:'xl/workbook.xml',data:encT.encode(wb)},

function parseCSV(text){
 text=text.replace(/^\uFEFF/,'');
 const rows=[];let row=[],cur='',inQ=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(inQ){
   if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else inQ=false;}
   else cur+=c;}
  else{
   if(c==='"')inQ=true;
   else if(c===','){row.push(cur);cur='';}
   else if(c==='\n'){row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[];}
   else if(c==='\r'){/* تجاهل */}
   else cur+=c;}}
 row.push(cur);
 if(row.some(x=>x!==''))rows.push(row);
 return rows;}

const IT=120000,LS='qyod_vault',subtle=crypto.subtle;
const b2h=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const h2b=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const enc=new TextEncoder(),dec=new TextDecoder();
async function kekOf(pin,salt){const km=await subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return subtle.deriveKey({name:'PBKDF2',salt,iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function wrapDek(dekRaw,pin){const salt=rnd(16),iv=rnd(12),k=await kekOf(pin,salt);const ct=await subtle.encrypt({name:'AES-GCM',iv},k,dekRaw);return{salt:b2h(salt),iv:b2h(iv),ct:b2h(ct)};}
async function unwrapDek(w,pin){const k=await kekOf(pin,h2b(w.salt));return subtle.decrypt({name:'AES-GCM',iv:h2b(w.iv)},k,h2b(w.ct));}
async function seal(obj,dek){const iv=rnd(12),ct=await subtle.encrypt({name:'AES-GCM',iv},dek,enc.encode(JSON.stringify(obj)));return{iv:b2h(iv),ct:b2h(ct)};}
async function unseal(env,dek){const pt=await subtle.decrypt({name:'AES-GCM',iv:h2b(env.iv)},dek,h2b(env.ct));return JSON.parse(dec.decode(pt));}
async function hmacHex(msg){const k=await subtle.importKey('raw',enc.encode('NOVA-TECH-LIC-V3-2025'),{name:'HMAC',hash:'SHA-256'},false,['sign']);return b2h(new Uint8Array(await subtle.sign('HMAC',k,enc.encode(msg))));}

function itemConv(it,uomId){if(!uomId)return 1;const u=(it.uoms||[]).find(x=>x.id===uomId);if(!u)return 1;

/* ================= محرك تقييم المخزون FIFO / LIFO / AVCO ================= */
const valMethod=it=>it.valMethod||db.meta.valMethod||'avco';
function stkIn(it,q,uc){q=r3(q);if(q<=0)return;uc=r4(uc);
 const m=valMethod(it);
 if(m==='avco'){const oq=+it.qty||0,oc=+it.cost||0,tq=r3(oq+q);it.cost=tq>0.0001?r4((oq*oc+q*uc)/tq):uc;it.qty=tq;}
 else{it.layers=it.layers||[];it.layers.push({q,c:uc});it.qty=r3((+it.qty||0)+q);it.cost=uc;}
 applyPrice(it);}
function stkOut(it,q){q=r3(q);if(q<=0)return 0;
 const m=valMethod(it);let cogs=0,need=q;
 if(m==='avco'){cogs=round2(q*(+it.cost||0));it.qty=r3((+it.qty||0)-q);return cogs;}
 it.layers=it.layers||[];
 while(need>0.0001){
  const L=m==='fifo'?it.layers[0]:it.layers[it.layers.length-1];
  if(!L){cogs+=need*(+it.cost||0);break;}
  const take=Math.min(L.q,need);
  cogs+=take*L.c;L.q=r3(L.q-take);need=r3(need-take);
  if(L.q<=0.0001){if(m==='fifo')it.layers.shift();else it.layers.pop();}}
 it.qty=r3((+it.qty||0)-q);
 return round2(cogs);}
function stkValueOf(it){const m=valMethod(it);
 if(m!=='avco'&&it.layers&&it.layers.length)return round2(it.layers.reduce((s,L)=>s+L.q*L.c,0));
 return round2((+it.qty||0)*(+it.cost||0));}
function stockValue(){return round2(db.items.reduce((s,i)=>s+stkValueOf(i),0));}
function rebuildItemCost(it){const keepPrice=it.price;
 it.qty=0;it.layers=[];it.cost=0;
 const ev=[];
 for(const inv of db.invoices){if(!inv.posted)continue;
  const rate=inv.rate||1;
  for(const l of inv.lines){if(l.item!==it.id)continue;
   const cv=l.conv||itemConv(it,l.uom);
   if(inv.type==='purchase')ev.push({d:inv.date,t:inv.t,type:'in',q:r3(l.qty*cv),uc:r4((+l.price||0)*rate/cv)});
   else ev.push({d:inv.date,t:inv.t,type:'out',q:r3(l.qty*cv)});}}
 for(const m of db.moves){if(!m.posted||m.item!==it.id)continue;
  if(m.type==='in')ev.push({d:m.date,t:m.t,type:'in',q:+m.qty,uc:+m.cost||0});
  else if(m.type==='out')ev.push({d:m.date,t:m.t,type:'out',q:+m.qty});
  else ev.push({d:m.date,t:m.t,type:'adj',q:+m.qty});}
 ev.sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));
 for(const e of ev){
  if(e.type==='in')stkIn(it,e.q,e.uc);
  else if(e.type==='out')stkOut(it,e.q);
  else{if(e.q>0)stkIn(it,e.q,+it.cost||0);else stkOut(it,-e.q);}}
 if(valMethod(it)==='avco')it.layers=[];
 it.price=keepPrice;}

/* ================= التسعير ================= */
function applyPrice(it){if(!it||!it.priceMode||it.priceMode==='manual')return;
 const v=+it.priceVal||0,c=+it.cost||0;
 if(it.priceMode==='mkup')it.price=round2(c*(1+v/100));
 else if(it.priceMode==='mfix')it.price=round2(c+v);
 else if(it.priceMode==='margin')it.price=v<100?round2(c/(1-v/100)):c;}

/* ================= محرك الأرصدة ================= */
function turnsMap(from,to,br){const m=new Map();
 for(const j of db.journal){if(!j.posted)continue;if(from&&j.date<from)continue;if(to&&j.date>to)continue;
  if(br&&(j.branch||'')!==br)continue;
  for(const l of j.lines){const e=m.get(l.acc)||{dr:0,cr:0};e.dr+=+l.dr||0;e.cr+=+l.cr||0;m.set(l.acc,e);}}
 for(const v of m.values()){v.dr=round2(v.dr);v.cr=round2(v.cr);}return m;}
function accAgg(a,m){if(isLeaf(a))return m.get(a.id)||{dr:0,cr:0};
 let dr=0,cr=0;for(const c of childrenOf(a.id)){const t=accAgg(c,m);dr+=t.dr;cr+=t.cr;}return{dr:round2(dr),cr:round2(cr)};}
function accTypeMap(){const mm=new Map();db.accounts.forEach(a=>mm.set(a.id,a.type));return mm;}
function cashAccounts(){return db.accounts.filter(a=>a.fin&&!a.isGroup&&a.active);}
function defaultFin(){return cashAccounts()[0]||null;}
function finBalances(br){const m=turnsMap(null,null,br);return cashAccounts().map(a=>{const t=m.get(a.id)||{dr:0,cr:0};return{a,bal:round2(t.dr-t.cr)};});}
function netProfit(from,to,br){const m=turnsMap(from,to,br),tm=accTypeMap();let rev=0,exp=0;
 for(const[id,t]of m){const ty=tm.get(id);if(ty==='revenue')rev+=t.cr-t.dr;else if(ty==='expense')exp+=t.dr-t.cr;}
 return{rev:round2(rev),exp:round2(exp),net:round2(rev-exp)};}

const pad=n=>String(n).padStart(4,'0');
function pushJournal({date,desc,lines,posted,ref,branch}){const j={id:uid(),no:'JV-'+pad(++db.seq.j),date,desc,lines,posted:!!posted,ref:ref||null,branch:branch||null,user:SEC?SEC.user.name:'النظام',t:Date.now()};db.journal.push(j);return j;}
function jTotal(j){return round2(j.lines.reduce((s,l)=>s+(+l.dr||0),0));}
function postInvoiceCore(inv){
 const rate=+inv.rate||1;
 const grossD=round2(inv.lines.reduce((s,l)=>s+l.qty*l.price,0)),
  afterD=round2(grossD-(+inv.disc||0)),
  taxD=round2(afterD*(+inv.vat||0)/100),
  netD=round2(afterD+taxD);
 const afterB=round2(afterD*rate),taxB=round2(taxD*rate),netB=round2(afterB+taxB);
 const sales=accByCode('4101'),invA=accByCode('1104'),vatA=accByCode('2102'),cogs=accByCode('5101');
 const lines=[];
 if(inv.type==='sale'){
  const deb=inv.pay==='cash'?accById(inv.finAcc):accById(db.partners.find(p=>p.id===inv.partner).accId);
  lines.push({acc:deb.id,dr:netB,cr:0},{acc:sales.id,dr:0,cr:afterB});
  if(taxB>0)lines.push({acc:vatA.id,dr:0,cr:taxB});
  let cost=0;
  for(const l of inv.lines){const it=db.items.find(i=>i.id===l.item);if(!it)continue;
   const cv=l.conv||itemConv(it,l.uom);
   cost+=stkOut(it,r3(l.qty*cv));}
  cost=round2(cost);
  if(cost>0)lines.push({acc:cogs.id,dr:cost,cr:0},{acc:invA.id,dr:0,cr:cost});
 }else{
  const crAcc=inv.pay==='cash'?accById(inv.finAcc):accById(db.partners.find(p=>p.id===inv.partner).accId);
  lines.push({acc:invA.id,dr:afterB,cr:0});
  if(taxB>0)lines.push({acc:vatA.id,dr:taxB,cr:0});
  lines.push({acc:crAcc.id,dr:0,cr:netB});
  for(const l of inv.lines){const it=db.items.find(i=>i.id===l.item);if(!it)continue;
   const cv=l.conv||itemConv(it,l.uom),bq=r3(l.qty*cv);
   const uc=bq>0?r4(l.qty*l.price*rate/bq):0;
   stkIn(it,bq,uc);}}
 const bal=round2(lines.reduce((s,l)=>s+(+l.dr||0)-(+l.cr||0),0));
 if(Math.abs(bal)>0.009)throw new Error('القيد المولّد غير متوازن ('+bal+')');
 const cc=inv.curr&&inv.curr!==baseCur()?` [${inv.curr} @ ${rate}]`:'';
 const j=pushJournal({date:inv.date,desc:(inv.type==='sale'?'فاتورة بيع ':'فاتورة شراء ')+inv.no+cc,lines,posted:true,ref:inv.no,branch:inv.branch});
 inv.posted=true;inv.jref=j.id;
 return j;}
function postVoucherCore(v){
 const rate=+v.rate||1,f=accById(v.fin),o=accById(v.acc);
 const amtB=round2((+v.amount||0)*rate);
 const lines=v.type==='receipt'?[{acc:f.id,dr:amtB,cr:0},{acc:o.id,dr:0,cr:amtB}]
  :[{acc:o.id,dr:amtB,cr:0},{acc:f.id,dr:0,cr:amtB}];
 const lbl={receipt:'سند قبض',payment:'سند صرف',transfer:'سند تحويل'}[v.type];
 const cc=v.curr&&v.curr!==baseCur()?` [${v.curr} @ ${rate}]`:'';
 const j=pushJournal({date:v.date,desc:lbl+' '+v.no+' — '+(v.desc||'')+cc,lines,posted:true,ref:v.no,branch:v.branch});
 v.posted=true;v.jref=j.id;return j;}
function postMoveCore(m){
 const it=db.items.find(i=>i.id===m.item),invA=accByCode('1104');
 const q=r3(+m.qty);let val=0,lines=[];
 if(m.type==='in'){val=round2(q*(+m.cost||0));stkIn(it,q,+m.cost||0);
  lines=[{acc:invA.id,dr:val,cr:0},{acc:m.acc,dr:0,cr:val}];}
 else if(m.type==='out'){val=stkOut(it,q);
  lines=[{acc:m.acc,dr:val,cr:0},{acc:invA.id,dr:0,cr:val}];}
 else{val=round2(Math.abs(q)*(+it.cost||0));
  if(q>0){stkIn(it,q,+it.cost||0);lines=[{acc:invA.id,dr:val,cr:0},{acc:accByCode('4102').id,dr:0,cr:val}];}
  else{stkOut(it,-q);lines=[{acc:accByCode('5105').id,dr:val,cr:0},{acc:invA.id,dr:0,cr:val}];}}
 const lbl={in:'إدخال مخزون',out:'صرف مخزون',adj:'تسوية جرد'}[m.type];
 const j=pushJournal({date:m.date,desc:lbl+' — '+it.name,lines,posted:true,ref:m.no,branch:m.branch});
 m.posted=true;m.jref=j.id;return j;}

function renderTree(){
 const q=(UI.aq||'').trim(),m=turnsMap(null,null),tree=$('#tree');if(!tree)return;
 const matchSet=new Set();
 if(q){db.accounts.forEach(a=>{if((a.code+' '+a.name).includes(q)){matchSet.add(a.id);let p=a.parent;while(p){matchSet.add(p);p=db.accounts.find(x=>x.id===p)?.parent;}}});}
 let h='';
 const walk=(pid,d)=>{for(const a of db.accounts.filter(x=>x.parent===pid).sort((x,y)=>x.code<y.code?-1:1)){
  if(q&&!matchSet.has(a.id))continue;
  const grp=!isLeaf(a),t=accAgg(a,m),open=UI.treeOpen.has(a.id)||q;
  h+=`<div class="trow ${grp?'grp':''} ${a.active?'':'off'}" style="padding-inline-start:${8+d*18}px">
   <button class="tw" ${grp?`onclick="treeToggle('${a.id}')"`:'disabled style="visibility:hidden"'}><i class="ph ${open?'ph-caret-down':'ph-caret-left'}"></i></button>
   <span class="tcode">${esc(a.code)}</span>
   <span class="tname" ${grp?`onclick="treeToggle('${a.id}')"`:''} style="${grp?'cursor:pointer':''}">${esc(a.name)}
    ${a.fin?'<span class="badge g">مالي</span>':''}${a.sys?'<span class="badge n">نظامي</span>':''}${a.active?'':'<span class="badge r">معطل</span>'}</span>
   <span class="tval">${fmt(t.dr)}</span><span class="tval">${fmt(t.cr)}</span>
   <span class="tacts">${can('accounts','add')?`<button class="btn ico sm" data-lb="+" title="حساب فرعي" onclick="accForm(null,'${a.id}')"><i class="ph ph-plus"></i></button>`:''}
   ${can('accounts','edit')?`<button class="btn ico sm" data-lb="تعديل" onclick="accForm('${a.id}',null)"><i class="ph ph-pencil-simple"></i></button>`:''}
   ${can('accounts','del')&&!a.sys?`<button class="btn ico sm" data-lb="حذف" onclick="accDel('${a.id}')"><i class="ph ph-trash" style="color:var(--bad)"></i></button>`:''}</span></div>`;
  if(grp&&open)walk(a.id,d+1);}};

  if(it&&c)g+=c.q*r4(it.price*itemConv(it,c.uom)/posRate());});

  $('#pNet').textContent=fmt(net);
  $('#pNetB').textContent=c!==baseCur()?`≈ ${fmt(round2(net*rate))} ${esc(baseCur())}`:'';
  $('#pNetB').style.color='var(--mut)';}

function curAdd(){if(!canOp())return;
 const code=($('#ncCode').value||'').trim().toUpperCase(),name=$('#ncName').value.trim(),sym=$('#ncSym').value.trim(),rate=+$('#ncRate').value||0;
 if(!/^[A-Z]{3,4}$/.test(code)){toast('رمز العملة 3-4 أحرف لاتينية','bad');return;}
 if(!name){toast('أدخل الاسم','bad');return;}
 if(rate<=0){toast('أدخل سعر صرف أكبر من صفر','bad');return;}
 if(db.currencies.some(c=>c.code===code)){toast('الرمز موجود مسبقاً','bad');return;}
 db.currencies.push({code,name,sym,rate});
 audit('إضافة عملة',code+' @ '+rate);
 persist().then(()=>{render();toast('أُضيفت العملة '+code+' ✓');});}
function curRate(code,v){const c=db.currencies.find(x=>x.code===code);if(!c)return;
 const r=+v;if(!r||r<=0){toast('سعر غير صالح','bad');render();return;}
 c.rate=r;audit('تحديث سعر صرف',code+' = '+r);persist().then(()=>toast('حُدّث سعر '+code+' ✓'));}
function curDel(code){confirmDlg(`حذف العملة ${code}؟ (المستندات القديمة تحتفظ برمزها وسعرها)`,()=>{
 db.currencies=db.currencies.filter(c=>c.code!==code);
 audit('حذف عملة',code);persist().then(()=>{render();toast('حُذفت العملة');});});}

function logoPick(inp){const f=inp.files[0];if(!f)return;

 r.onload=()=>{const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,160/Math.max(img.width,img.height));
   c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   db.meta.co=db.meta.co||{};db.meta.co.logo=c.toDataURL('image/png');

function restoreFile(inp){const f=inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{const j=JSON.parse(r.result);
  if(!j.v||!j.deks||!j.data)throw new Error('صيغة غير صحيحة');
  confirmDlg('سيُستبدل الخزين الحالي كلياً. متابعة؟',()=>{localStorage.setItem(LS,JSON.stringify(j));SEC=null;db=null;rawDb=null;location.reload();});
 }catch(e){toast('ملف غير صالح: '+e.message,'bad');}};
 r.readAsText(f);inp.value='';}

function sheetAoa(t){
 switch(t){
  case 'accounts':{const rows=[['الرمز','الاسم','التصنيف','الأب','مالي','نشط']];
   const walk=pid=>{for(const a of childrenOf(pid)){rows.push([a.code,a.name,ACC_TYPES[a.type],a.parent?accById(a.parent).code:'',a.fin?'نعم':'',a.active?'نعم':'لا']);walk(a.id);}};walk(null);return rows;}
  case 'journal':{const rows=[['القيد','التاريخ','البيان','الحساب','مدين','دائن','الحالة','الفرع']];
   for(const j of db.journal)for(const l of j.lines){const a=accById(l.acc);
    rows.push([j.no,j.date,j.desc,a?a.code+' '+a.name:'',+l.dr||0,+l.cr||0,j.posted?'مرحّل':'مسودة',brName(j.branch)]);}return rows;}
  case 'invoices':{const rows=[['الفاتورة','النوع','التاريخ','الطرف','العملة','سعر الصرف','الصنف','الكمية','الوحدة','السعر','الصافي بالعملة','الصافي بالأساس','الحالة','الفرع']];
   for(const i of db.invoices){const p=db.partners.find(x=>x.id===i.partner),rate=+i.rate||1;
    for(const l of i.lines){const it=db.items.find(x=>x.id===l.item);
     rows.push([i.no,i.type==='sale'?'بيع':'شراء',i.date,i.pay==='cash'?'نقدي':(p?p.name:''),i.curr,rate,it?it.name:'',+l.qty,l.un||(it?it.bu:''),+l.price,round2(invNet(i)),round2(invNet(i)*rate),i.posted?'مرحّل':'مسودة',brName(i.branch)]);}}return rows;}
  case 'vouchers':{const rows=[['السند','النوع','التاريخ','العملة','الصرف','المبلغ','المكافئ بالأساس','البيان','الحالة','الفرع']];
   for(const v of db.vouchers){const rate=+v.rate||1;
    rows.push([v.no,{receipt:'قبض',payment:'صرف',transfer:'تحويل'}[v.type],v.date,v.curr,rate,+v.amount,round2(v.amount*rate),v.desc||'',v.posted?'مرحّل':'مسودة',brName(v.branch)]);}return rows;}
  case 'items':return[['الرمز','الاسم','الأساسية','الوحدات الفرعية','التقييم','التسعير','الكمية','التكلفة','سعر البيع','الحد','نشط'],
   ...db.items.map(i=>[i.code,i.name,i.bu,i.uoms.map(u=>u.name+'(x'+u.f+')').join(' | '),(i.valMethod||db.meta.valMethod).toUpperCase(),PRICE_MODES[i.priceMode]||'',+i.qty,+i.cost,+i.price,+i.minQty,i.active?'نعم':'لا'])];
  case 'moves':{const rows=[['الحركة','النوع','التاريخ','الصنف','الكمية','التكلفة','البيان','الحالة','الفرع']];
   for(const m of db.moves){const it=db.items.find(x=>x.id===m.item);
    rows.push([m.no,{in:'إدخال',out:'صرف',adj:'تسوية'}[m.type],m.date,it?it.name:'',+m.qty,+m.cost||0,m.desc||'',m.posted?'مرحّل':'مسودة',brName(m.branch)]);}return rows;}
  case 'partners':return[['الرمز','الاسم','النوع','الهاتف','نشط'],...db.partners.map(p=>[p.code,p.name,p.kind==='customer'?'عميل':'مورد',p.phone||'',p.active?'نعم':'لا'])];
  case 'branches':return[['الاسم','نشط'],...db.branches.map(b=>[b.name,b.active?'نعم':'لا'])];
 }}}

const IMP_DEFS={
 items:{t:'أصناف',cols:['الرمز*','الاسم*','الوحدة الأساسية','التكلفة','سعر البيع','حد أدنى','كمية افتتاحية'],ex:['ITM-900','دفتر ملاحظات','كرتون',30,45,5,10]},
 partners:{t:'أطراف',cols:['الاسم*','النوع (عميل/مورد)*','الهاتف'],ex:['شركة الأمل','عميل','0500000000']},
 accounts:{t:'حسابات',cols:['الرمز*','الاسم*','التصنيف*','رمز الأب','مالي (نعم/لا)'],ex:['1105','صندوق الفرع','أصول','11','نعم']},
 moves:{t:'حركات إدخال مخزون',cols:['رمز الصنف*','الكمية*','تكلفة الوحدة*','التاريخ YYYY-MM-DD','رمز الحساب (افتراضي 3101)'],ex:['ITM-001',50,10,today(),'3101']}};
function importOpen(type){if(!canOp())return;UI.impType=type;UI.impRows=null;const d=IMP_DEFS[type];
 mDialog('استيراد '+d.t+' من Excel',`
 <p class="mini">أعمدة الملف بالترتيب: <b>${d.cols.join(' | ')}</b></p>
 <p class="mini">· <b>CSV يعمل دائماً بدون إنترنت</b> — من Excel: ملف ← حفظ باسم ← CSV UTF-8.<br>· ملفات XLSX تُقرأ تلقائياً إذا كانت مكتبة القراءة محمّلة (اتصال أول).</p>
 <div class="mrow"><button class="btn gh sm" onclick="dlTemplate('${type}')"><i class="ph ph-file-xls"></i> تنزيل قالب CSV</button>
 <button class="btn pri sm" onclick="$('#xlsIn').click()"><i class="ph ph-upload-simple"></i> اختيار ملف (CSV / XLSX)</button></div>
 <div id="impPrev"></div><div id="impRes"></div>`);}
function dlTemplate(type){const d=IMP_DEFS[type];
 dlCSV('NOVA-TPL-'+type+'.csv',[d.cols,d.ex]);
 toast('نُزّل القالب — املأه ثم استورده');}
function importPreviewDone(rows){
 UI.impRows=rows;
 $('#impPrev').innerHTML=`<hr class="sep"><p class="mini">معاينة — ${rows.length-1} صف:</p>
 <div class="tscroll"><table style="min-width:420px"><tbody>${rows.slice(0,8).map(row=>`<tr>${row.slice(0,7).map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
 <div class="mrow"><button class="btn pri" onclick="importRun()"><i class="ph ph-check-circle"></i> تنفيذ الاستيراد</button></div>`;}
function importPick(inp){const f=inp.files[0];if(!f)return;
 const isCsv=/\.csv$/i.test(f.name);
 if(!isCsv&&!XLSXok()){toast('قراءة XLSX تحتاج اتصالاً أول مرة — بدّل الملف إلى CSV (حفظ باسم ← CSV) للاستيراد الآن','bad');inp.value='';return;}
 if(!$('#impPrev')){toast('افتح نافذة الاستيراد أولاً','info');inp.value='';return;}
 const done=rows=>{try{
   rows=rows.filter(row=>row.some(c=>String(c).trim()!==''));
   if(rows.length<2)throw new Error('الملف فارغ أو رؤوس فقط');
   importPreviewDone(rows);
  }catch(e){toast('تعذّرت القراءة: '+e.message,'bad');}
  inp.value='';};
 if(isCsv){f.text().then(t=>done(parseCSV(t))).catch(e=>toast('تعذّرت قراءة الملف: '+e.message,'bad'));}
 else{const r=new FileReader();
  r.onload=()=>{try{
   const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});
   done(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}));
  }catch(e){toast('تعذّرت قراءة الملف: '+e.message,'bad');}inp.value='';};
  r.readAsArrayBuffer(f);}}
async function importRun(){
 if(!UI.impRows||!canOp())return;
 const type=UI.impType,rows=UI.impRows.slice(1);
 let ok=0;const errs=[];
 for(let i=0;i<rows.length;i++){
  const r=rows[i],ln='صف '+(i+2)+': ';
  try{
   if(type==='items'){
    const code=String(r[0]??'').trim(),name=String(r[1]??'').trim();
    if(!code||!name)throw new Error('رمز/اسم مفقود');
    const cost=+r[3]||0,price=+r[4]||0,min=+r[5]||0,opn=+r[6]||0,bu=String(r[2]??'').trim()||'وحدة';
    const ex=db.items.find(x=>x.code===code);
    if(ex){ex.name=name;ex.bu=bu;ex.unit=bu;if(cost)ex.cost=cost;if(price)ex.price=price;ex.minQty=min;applyPrice(ex);ok++;}
    else{const it={id:uid(),code,name,bu,unit:bu,uoms:[],cost,price,minQty:min,qty:0,active:true,valMethod:null,priceMode:db.meta.priceDef,priceVal:0,layers:[]};
     applyPrice(it);db.items.push(it);
     if(opn>0){const m={id:uid(),no:'MV-'+pad(++db.seq.m),type:'in',date:today(),item:it.id,qty:opn,cost,acc:accByCode('3101').id,desc:'استيراد Excel',posted:false,branch:null,user:SEC.user.name,t:Date.now(),jref:null};
      db.moves.push(m);postMoveCore(m);}ok++;}}
   else if(type==='partners'){
    const name=String(r[0]??'').trim(),kind=String(r[1]??'').trim(),phone=String(r[2]??'').trim();
    if(!name)throw new Error('اسم مفقود');
    addPartner(name,kind.includes('مورد')?'supplier':'customer',phone);ok++;}
   else if(type==='accounts'){
    const code=String(r[0]??'').trim(),name=String(r[1]??'').trim(),ty=String(r[2]??'').trim(),pc=String(r[3]??'').trim(),fin=String(r[4]??'').trim();
    if(!code||!name)throw new Error('رمز/اسم مفقود');
    if(db.accounts.some(a=>a.code===code))throw new Error('رمز مكرر');
    const tm={'أصول':'asset','خصوم':'liability','حقوق ملكية':'equity','إيرادات':'revenue','مصروفات':'expense'}[ty];
    if(!tm)throw new Error('تصنيف غير معروف: '+ty);
    const par=pc?db.accounts.find(a=>a.code===pc):null;
    db.accounts.push({id:uid(),code,name,type:tm,parent:par?par.id:null,isGroup:false,fin:fin==='نعم'||fin==='yes',sys:false,active:true});ok++;}
   else if(type==='moves'){
    const code=String(r[0]??'').trim(),qty=+r[1]||0,cost=+r[2]||0,dt=String(r[3]??'').trim()||today(),accCode=String(r[4]??'').trim()||'3101';
    const it=db.items.find(x=>x.code===code);
    if(!it)throw new Error('صنف غير موجود: '+code);
    if(qty<=0||cost<=0)throw new Error('كمية/تكلفة غير صالحة');
    const acc=accByCode(accCode)||accByCode('3101');
    const m={id:uid(),no:'MV-'+pad(++db.seq.m),type:'in',date:/^\d{4}-\d{2}-\d{2}$/.test(dt)?dt:today(),item:it.id,qty,cost,acc:acc.id,desc:'استيراد Excel',posted:false,branch:null,user:SEC.user.name,t:Date.now(),jref:null};
    db.moves.push(m);postMoveCore(m);ok++;}
  }catch(e){errs.push(ln+e.message);}}
 opInc();audit('استيراد',IMP_DEFS[type].t+' — نجح '+ok+' / أخطاء '+errs.length);
 await persist();
 if($('#impRes'))$('#impRes').innerHTML=`<div class="licok" style="margin-top:10px"><b>النتيجة:</b> استُورد ${ok} صف${errs.length?' — فشل '+errs.length+':<br>'+errs.slice(0,8).map(esc).join('<br>')+(errs.length>8?'…':''):''}
 <div class="mrow"><button class="btn pri sm" onclick="mClose();render()">تم</button></div></div>`;
 toast('اكتمل الاستيراد: '+ok+' صف ✓');}

if(!crypto.subtle){document.body.innerHTML='<div style="padding:40px;text-align:center;font-family:sans-serif">متصفحك لا يدعم التشفير الحديث.</div>';}
else{bootFlow();}
async function bootFlow(){
 await ensureDev();
 const L=loadLic();
 if(L){const v=licValid();if(!v.ok){licGate(v.why);return;}}
 try{rawDb=JSON.parse(localStorage.getItem(LS));}catch(e){rawDb=null;}
 rawDb?showLock():showSetup();}
</script>
